<title>501 / 301 — Fléchettes</title>
<style>
  :root{
    --felt:#14261E;
    --felt-deep:#0D1913;
    --ivory:#EDE6D3;
    --ivory-dim:#9FAE9F;
    --gold:#C9A227;
    --red:#A93226;
    --line:#33473C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--felt-deep);
    color:var(--ivory);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{height:100vh; height:100dvh; display:flex; flex-direction:column;}

  /* ---------- SETUP SCREEN ---------- */
  #setup{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:28px 24px; gap:22px;
  }
  .brand{
    font-size:15px; letter-spacing:.02em; color:var(--gold); font-weight:600; margin-bottom:-8px;
  }
  .brand-title{
    font-size:40px; font-weight:800; letter-spacing:-0.02em; line-height:1.05; color:var(--ivory);
  }
  .field-label{font-size:13px; color:var(--ivory-dim); margin-bottom:6px; font-weight:500;}
  .name-input{
    width:100%; padding:14px 16px; border-radius:10px; border:1px solid var(--line);
    background:var(--felt); color:var(--ivory); font-size:17px; font-weight:600;
  }
  .name-input:focus{outline:none; border-color:var(--gold);}
  .game-toggle{display:flex; gap:10px;}
  .game-toggle button{
    flex:1; padding:16px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--felt); color:var(--ivory-dim); font-size:20px; font-weight:800;
  }
  .game-toggle button.active{border-color:var(--gold); color:var(--gold); background:#1C3327;}
  .start-btn{
    margin-top:8px; padding:17px 0; border-radius:12px; border:none;
    background:var(--gold); color:var(--felt-deep); font-size:17px; font-weight:800;
  }
  .start-btn:active{opacity:.85;}

  /* ---------- GAME SCREEN ---------- */
  #game{
    flex:1; display:none; flex-direction:column; min-height:0;
    width:100%; max-width:640px; margin:0 auto;
  }
  .player-panel{
    padding:14px 20px; position:relative; transition:background .25s ease;
    border-bottom:1px solid var(--line);
  }
  .player-panel.active{background:linear-gradient(180deg,#1C3327,var(--felt-deep) 130%);}
  .p-row{display:flex; align-items:baseline; justify-content:space-between;}
  .p-name{font-size:14px; font-weight:700; color:var(--ivory-dim); letter-spacing:.01em;}
  .player-panel.active .p-name{color:var(--gold);}
  .p-legs{font-size:12px; color:var(--ivory-dim);}
  .p-score{
    font-size:56px; font-weight:800; letter-spacing:-0.03em; line-height:1.05;
    color:var(--ivory-dim); transition:color .25s ease;
  }
  .player-panel.active .p-score{color:var(--ivory);}
  .p-avg{font-size:12px; color:var(--ivory-dim); margin-top:2px;}

  #checkoutBar{
    padding:10px 20px; min-height:44px; display:flex; align-items:center;
    background:var(--felt); border-bottom:1px solid var(--line);
  }
  #checkoutBar .co-label{font-size:13px; font-weight:700; color:var(--ivory-dim); margin-right:10px; white-space:nowrap;}
  #checkoutBar .co-route{font-size:17px; font-weight:800; color:var(--gold); letter-spacing:.01em;}
  #checkoutBar .co-none{font-size:14px; color:var(--ivory-dim); font-weight:500;}
  #checkoutBar.flash{animation:flash .4s ease;}
  @keyframes flash{0%{background:#2A4636;} 100%{background:var(--felt);}}

  #turnRow{
    display:flex; align-items:center; gap:8px; padding:10px 20px; min-height:40px;
    border-bottom:1px solid var(--line); overflow-x:auto;
  }
  .dart-chip{
    background:var(--felt); border:1px solid var(--line); color:var(--ivory);
    font-size:13px; font-weight:700; padding:6px 10px; border-radius:8px; white-space:nowrap;
  }
  .dart-chip.miss{color:var(--ivory-dim); border-style:dashed;}
  #undoBtn{
    margin-left:auto; background:none; border:none; color:var(--ivory-dim);
    font-size:13px; font-weight:600; padding:6px 4px; flex-shrink:0;
  }

  #keypad{flex:1; display:flex; flex-direction:column; padding:10px 14px 14px; min-height:0; gap:8px;}
  .mult-row{display:flex; gap:8px;}
  .mult-btn{
    flex:1; padding:11px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--felt); color:var(--ivory-dim); font-size:14px; font-weight:800; letter-spacing:.03em;
  }
  .mult-btn.sel{
    color:var(--felt-deep);
  }
  .mult-btn[data-m="S"].sel{background:var(--ivory);}
  .mult-btn[data-m="D"].sel{background:var(--red); color:var(--ivory);}
  .mult-btn[data-m="T"].sel{background:var(--gold);}

  #numGrid{
    flex:1; display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:1fr;
    gap:7px; min-height:0;
  }
  .num-btn{
    border-radius:9px; border:1px solid var(--line); background:var(--felt);
    color:var(--ivory); font-size:19px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .num-btn:active{background:#233A2E;}
  .bottom-row{display:flex; gap:7px;}
  .bottom-row .num-btn{flex:1; font-size:14px; font-weight:800;}
  .bottom-row .bull50{color:var(--red);}
  .bottom-row .miss{color:var(--ivory-dim);}

  #scoreCol{display:flex; flex-direction:column;}
  #keypadCol{display:flex; flex-direction:column; flex:1; min-height:0;}

  /* ---------- TABLET (portrait) : recentrer, agrandir ---------- */
  @media (min-width:700px){
    #setup{max-width:460px; margin:0 auto; width:100%;}
    .p-score{font-size:72px;}
    .brand-title{font-size:46px;}
    .num-btn{font-size:26px;}
    .bottom-row .num-btn{font-size:16px;}
    .mult-btn{font-size:16px; padding:15px 0;}
    #numGrid{gap:10px;}
    .dart-chip{font-size:15px; padding:8px 13px;}
    #checkoutBar .co-route{font-size:20px;}
  }

  /* ---------- TABLET (paysage) : deux colonnes côte à côte ---------- */
  @media (min-width:860px) and (orientation:landscape){
    #setup{max-width:420px;}
    #game{flex-direction:row; max-width:none;}
    #scoreCol{
      width:40%; max-width:420px; border-right:1px solid var(--line);
      padding-top:8vh; overflow-y:auto;
    }
    #keypadCol{width:60%;}
    #keypad{padding:22px 26px 26px;}
    .p-score{font-size:80px;}
    #checkoutBar{padding:16px 20px;}
  }

  /* ---------- OVERLAY (bust / win) ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(13,25,19,.94); display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:30px;
    z-index:10; text-align:center;
  }
  #overlay .ov-title{font-size:34px; font-weight:800;}
  #overlay .ov-title.bust{color:var(--red);}
  #overlay .ov-title.win{color:var(--gold);}
  #overlay .ov-sub{font-size:15px; color:var(--ivory-dim); max-width:280px;}
  #overlay button{
    padding:15px 34px; border-radius:12px; border:none; background:var(--gold);
    color:var(--felt-deep); font-size:16px; font-weight:800;
  }
  #newMatchLink{
    text-align:center; padding:8px; font-size:12px; color:var(--ivory-dim); border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="setup">
    <div>
      <div class="brand">FLÉCHETTES</div>
      <div class="brand-title">Nouvelle&nbsp;partie</div>
    </div>
    <div>
      <div class="field-label">Format</div>
      <div class="game-toggle">
        <button id="btn501" class="active" onclick="setGameType(501)">501</button>
        <button id="btn301" onclick="setGameType(301)">301</button>
      </div>
    </div>
    <div>
      <div class="field-label">Joueur 1</div>
      <input class="name-input" id="name1" value="Joueur 1" maxlength="14">
    </div>
    <div>
      <div class="field-label">Joueur 2</div>
      <input class="name-input" id="name2" value="Joueur 2" maxlength="14">
    </div>
    <button class="start-btn" onclick="startMatch()">Commencer la partie</button>
  </div>

  <!-- GAME -->
  <div id="game">
   <div id="scoreCol">
    <div class="player-panel" id="panel1">
      <div class="p-row"><span class="p-name" id="pname1">Joueur 1</span><span class="p-legs" id="plegs1">Manches : 0</span></div>
      <div class="p-score" id="pscore1">501</div>
    </div>
    <div class="player-panel" id="panel2">
      <div class="p-row"><span class="p-name" id="pname2">Joueur 2</span><span class="p-legs" id="plegs2">Manches : 0</span></div>
      <div class="p-score" id="pscore2">501</div>
    </div>

    <div id="checkoutBar">
      <span class="co-label">FINITION</span>
      <span id="coContent" class="co-none">—</span>
    </div>

    <div id="turnRow">
      <span id="dartChips"></span>
      <button id="undoBtn" onclick="undoLastDart()">Annuler</button>
    </div>
   </div>

   <div id="keypadCol">
    <div id="keypad">
      <div class="mult-row">
        <button class="mult-btn sel" data-m="S" onclick="setMultiplier('S')">SIMPLE</button>
        <button class="mult-btn" data-m="D" onclick="setMultiplier('D')">DOUBLE</button>
        <button class="mult-btn" data-m="T" onclick="setMultiplier('T')">TRIPLE</button>
      </div>
      <div id="numGrid"></div>
      <div class="bottom-row">
        <button class="num-btn" onclick="pressBull25()">25</button>
        <button class="num-btn bull50" onclick="pressBull50()">BULL 50</button>
        <button class="num-btn miss" onclick="pressMiss()">RATÉ</button>
      </div>
    </div>

    <div id="newMatchLink" onclick="confirmNewMatch()">Nouveau match</div>
   </div>
  </div>

  <!-- OVERLAY -->
  <div id="overlay">
    <div class="ov-title" id="ovTitle"></div>
    <div class="ov-sub" id="ovSub"></div>
    <button id="ovBtn" onclick="ovConfirm()"></button>
  </div>

</div>

<script>
/* ======================= CHECKOUT ENGINE ======================= */
function buildSegments(){
  const seg=[];
  for(let n=20;n>=1;n--) seg.push({value:3*n,label:'T'+n});
  seg.push({value:50,label:'Bull'});
  for(let n=20;n>=1;n--) seg.push({value:2*n,label:'D'+n});
  seg.push({value:25,label:'25'});
  for(let n=20;n>=1;n--) seg.push({value:n,label:''+n});
  return seg;
}
const SEGMENTS = buildSegments();

function finish1(S){
  if(S===50) return [{value:50,label:'Bull'}];
  if(S>=2 && S<=40 && S%2===0) return [{value:S,label:'D'+(S/2)}];
  return null;
}
function finish2(S){
  for(const s of SEGMENTS){
    const rem=S-s.value;
    if(rem<=0) continue;
    const f=finish1(rem);
    if(f) return [s,...f];
  }
  return null;
}
function finish3(S){
  for(const s of SEGMENTS){
    const rem=S-s.value;
    if(rem<=0) continue;
    const f=finish2(rem);
    if(f) return [s,...f];
  }
  return null;
}
function bestCheckout(S,dartsLeft){
  if(S<=1) return null;
  const f1=finish1(S);
  if(f1) return f1;
  if(dartsLeft>=2){ const f2=finish2(S); if(f2) return f2; }
  if(dartsLeft>=3){ const f3=finish3(S); if(f3) return f3; }
  return null;
}

/* ======================= GAME STATE ======================= */
let state = null;

function setGameType(t){
  document.getElementById('btn501').classList.toggle('active', t===501);
  document.getElementById('btn301').classList.toggle('active', t===301);
  window._gameType = t;
}
window._gameType = 501;

function startMatch(){
  const n1 = document.getElementById('name1').value.trim() || 'Joueur 1';
  const n2 = document.getElementById('name2').value.trim() || 'Joueur 2';
  state = {
    startScore: window._gameType,
    players: [{name:n1, legsWon:0}, {name:n2, legsWon:0}],
    scores: [window._gameType, window._gameType],
    active: 0,
    turnStartScore: window._gameType,
    dartsThisTurn: [],
    dartsLeft: 3,
    legStarter: 0
  };
  document.getElementById('setup').style.display='none';
  document.getElementById('game').style.display='flex';
  buildNumGrid();
  render();
}

function buildNumGrid(){
  const grid = document.getElementById('numGrid');
  grid.innerHTML='';
  for(let n=1;n<=20;n++){
    const b=document.createElement('button');
    b.className='num-btn';
    b.textContent=n;
    b.onclick=()=>pressNumber(n);
    grid.appendChild(b);
  }
}

let multiplier='S';
function setMultiplier(m){
  multiplier=m;
  document.querySelectorAll('.mult-btn').forEach(b=>{
    b.classList.toggle('sel', b.dataset.m===m);
  });
}

function pressNumber(n){
  let value, label, isDouble=false;
  if(multiplier==='S'){ value=n; label=''+n; }
  else if(multiplier==='D'){ value=2*n; label='D'+n; isDouble=true; }
  else { value=3*n; label='T'+n; }
  applyDart(value,label,isDouble);
}
function pressBull25(){ applyDart(25,'25',false); }
function pressBull50(){ applyDart(50,'Bull',true); }
function pressMiss(){ applyDart(0,'Raté',false); }

function applyDart(value,label,isDouble){
  if(!state || overlayOpen()) return;
  const active = state.active;
  const before = state.scores[active];
  const after = before - value;

  state.dartsThisTurn.push({value,label,isDouble});
  state.dartsLeft -= 1;
  setMultiplier('S');

  if(after<0 || after===1 || (after===0 && !isDouble)){
    // BUST
    state.scores[active] = state.turnStartScore;
    renderScores();
    renderDartChips();
    showOverlay('bust', (state.players[active].name+' — BUST').toUpperCase(),
      'Score annulé, retour à '+state.turnStartScore+'. Tour suivant.');
    return;
  }

  if(after===0 && isDouble){
    // WIN
    state.scores[active] = 0;
    state.players[active].legsWon += 1;
    renderScores();
    renderDartChips();
    showOverlay('win', '🎯 '+state.players[active].name.toUpperCase()+' GAGNE LA MANCHE',
      state.players[0].name+' '+state.players[0].legsWon+' — '+state.players[1].legsWon+' '+state.players[1].name);
    return;
  }

  state.scores[active] = after;

  if(state.dartsLeft===0){
    endTurn();
  } else {
    render();
  }
}

function endTurn(){
  state.active = state.active===0 ? 1 : 0;
  state.dartsThisTurn = [];
  state.dartsLeft = 3;
  state.turnStartScore = state.scores[state.active];
  render();
}

function undoLastDart(){
  if(!state || state.dartsThisTurn.length===0 || overlayOpen()) return;
  const last = state.dartsThisTurn.pop();
  state.dartsLeft += 1;
  state.scores[state.active] += last.value;
  render();
}

function render(){
  renderScores();
  renderDartChips();
  renderCheckout();
}

function renderScores(){
  document.getElementById('pname1').textContent = state.players[0].name;
  document.getElementById('pname2').textContent = state.players[1].name;
  document.getElementById('plegs1').textContent = 'Manches : '+state.players[0].legsWon;
  document.getElementById('plegs2').textContent = 'Manches : '+state.players[1].legsWon;
  document.getElementById('pscore1').textContent = state.scores[0];
  document.getElementById('pscore2').textContent = state.scores[1];
  document.getElementById('panel1').classList.toggle('active', state.active===0);
  document.getElementById('panel2').classList.toggle('active', state.active===1);
}

function renderDartChips(){
  const wrap = document.getElementById('dartChips');
  wrap.innerHTML='';
  state.dartsThisTurn.forEach(d=>{
    const c=document.createElement('span');
    c.className='dart-chip'+(d.label==='Raté'?' miss':'');
    c.textContent=d.label;
    wrap.appendChild(c);
  });
}

function renderCheckout(){
  const bar = document.getElementById('checkoutBar');
  const content = document.getElementById('coContent');
  const route = bestCheckout(state.scores[state.active], state.dartsLeft);
  if(route){
    content.className='co-route';
    content.textContent = route.map(r=>r.label).join('  →  ');
  } else {
    content.className='co-none';
    if(state.scores[state.active] > 170){
      content.textContent = 'Vise le maximum — Triple 20';
    } else {
      content.textContent = 'Pas de finition avec '+state.dartsLeft+' fléchette(s) restante(s)';
    }
  }
  bar.classList.remove('flash');
  void bar.offsetWidth;
  bar.classList.add('flash');
}

/* ======================= OVERLAY ======================= */
let _overlayMode = null;
function overlayOpen(){ return document.getElementById('overlay').style.display==='flex'; }

function showOverlay(mode, title, sub){
  _overlayMode = mode;
  const ov = document.getElementById('overlay');
  document.getElementById('ovTitle').className='ov-title '+mode;
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovSub').textContent = sub;
  document.getElementById('ovBtn').textContent = mode==='win' ? 'Manche suivante' : 'Tour suivant';
  ov.style.display='flex';
}

function ovConfirm(){
  document.getElementById('overlay').style.display='none';
  if(_overlayMode==='bust'){
    endTurn();
  } else if(_overlayMode==='win'){
    // start next leg — loser (or alternation) throws first
    state.legStarter = state.legStarter===0 ? 1 : 0;
    state.scores = [state.startScore, state.startScore];
    state.active = state.legStarter;
    state.turnStartScore = state.startScore;
    state.dartsThisTurn = [];
    state.dartsLeft = 3;
    render();
  }
  _overlayMode = null;
}

function confirmNewMatch(){
  if(confirm('Terminer la partie en cours et revenir au menu ?')){
    document.getElementById('game').style.display='none';
    document.getElementById('setup').style.display='flex';
    state = null;
  }
}
</script>
